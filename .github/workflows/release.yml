name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fcitx5 \
            libfcitx5core-dev \
            libfcitx5config-dev \
            libfcitx5utils-dev \
            fcitx5-modules-dev \
            extra-cmake-modules \
            libxkbcommon-dev \
            cmake \
            pkg-config

      - name: Build Rust core
        run: cargo build --manifest-path core/Cargo.toml --release

      - name: Build Fcitx5 addon
        run: |
          cd platforms/linux
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Package
        run: |
          V="${GITHUB_REF_NAME#v}"
          cd platforms/linux
          mkdir -p dist
          cp build/src/libgonhanh.so dist/
          cp -r data/* dist/
          # Ensure core lib is available
          cp ../../core/target/release/libgonhanh_core.so dist/ || true
          tar -czvf "gonhanh-${V}-linux.tar.gz" -C dist .

      - name: Get Tag Message
        id: tag_message
        run: |
          git fetch origin tag ${{ github.ref_name }} --force
          TAG_MSG=$(git for-each-ref --format='%(contents)' refs/tags/${{ github.ref_name }})
          {
            echo "message<<EOF"
            echo "$TAG_MSG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            platforms/linux/*.tar.gz
          body: ${{ steps.tag_message.outputs.message }}
          generate_release_notes: ${{ steps.tag_message.outputs.message == '' }}
