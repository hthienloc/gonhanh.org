name: Dev Packaging

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Multi-Distro (Test)
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, fedora]
    
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.distro == 'ubuntu' && 'ubuntu:latest' || 'fedora:latest' }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies (Ubuntu)
        if: matrix.distro == 'ubuntu'
        run: |
          apt-get update
          apt-get install -y fcitx5 libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev cmake pkg-config cargo rustc libxkbcommon-dev extra-cmake-modules g++
          
      - name: Install dependencies (Fedora)
        if: matrix.distro == 'fedora'
        run: |
          dnf install -y fcitx5-devel extra-cmake-modules libxkbcommon-devel cmake gcc-c++ pkgconfig cargo rust
          
      - name: Build Rust core
        run: cargo build --manifest-path core/Cargo.toml --release
        
      - name: Build C++ addon
        run: |
          cd platforms/linux
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20
          make -j$(nproc)
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gonhanh-dev-${{ matrix.distro }}
          path: |
            platforms/linux/build/gonhanh.so
            core/target/release/libgonhanh_core.so
